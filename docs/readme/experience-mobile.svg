<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1630" viewBox="0 0 720 1630" role="img" aria-labelledby="title desc">
    <title id="title">The CinemaX customer journey</title><desc id="desc">Discover posters, trailers, genres and showtimes. Choose Standard, Premium, Family or Couple seats with weekday/weekend pricing. Five-minute booking holds lead to Stripe card payment and confirmation. Email verification and Google sign-in need integration setup. The illustrations are conceptual, not application screenshots.</desc><defs>
      <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a855f7"/><stop offset="1" stop-color="#ec4899"/></linearGradient>
      <linearGradient id="ice" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#a855f7"/></linearGradient>
      <radialGradient id="halo"><stop stop-color="#7c3aed" stop-opacity=".23"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
      <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0v40" fill="none" stroke="#a855f7" stroke-opacity=".055"/></pattern>
      <filter id="glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="5"/></filter>
    </defs>
    <style>
      text{font-family:'Segoe UI',Arial,Helvetica,sans-serif} .mono{font-family:Consolas,'Liberation Mono',monospace}
      .float{animation:float 9s ease-in-out infinite} .breathe{animation:breathe 5s ease-in-out infinite}
      .signal{stroke-dasharray:5 12;animation:signal 12s linear infinite}
      @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
      @keyframes breathe{0%,100%{opacity:.65}50%{opacity:1}}
      @keyframes signal{to{stroke-dashoffset:-170}}
      @media(prefers-reduced-motion:reduce){*{animation:none!important}}
    </style>
    <defs><clipPath id="panel"><rect width="720" height="1630" rx="24"/></clipPath></defs>
    <rect x="0.5" y="0.5" width="719" height="1629" rx="24" fill="#07070f" stroke="#282438" /><g clip-path="url(#panel)"><text x="48" y="54" font-size="20" fill="#22d3ee" font-weight="600" letter-spacing="2.8">THE CUSTOMER EXPERIENCE</text><text x="48" y="112" font-size="43" fill="#f0eeff" font-weight="600" letter-spacing="-1.5">Front row. Full journey.</text><text x="48" y="151" font-size="26.25" fill="#aaa5bf" font-weight="400" >From the first trailer to the final confirmation.</text><rect x="48" y="190" width="624" height="414" rx="20" fill="#0e0e1a" stroke="#282438" /><text x="74" y="225" font-size="20" fill="#22d3ee" font-weight="600" letter-spacing="2.8">01 / DISCOVER</text><rect x="74" y="249" width="572" height="210" rx="12" fill="#131020" stroke="#302642" /><ellipse cx="405.76" cy="327" rx="120" ry="100" fill="url(#halo)"/><circle cx="405.76" cy="327" r="48" fill="#0a0914" stroke="url(#brand)" stroke-width="4"/><circle cx="405.76" cy="327" r="51" fill="none" stroke="#ec4899" stroke-width="5" opacity=".3" filter="url(#glow)"/><path d="M88 409Q405.76 371 632 405" fill="none" stroke="#a855f7" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.5"/><path d="M88 416Q405.76 382 632 412" fill="none" stroke="#a855f7" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.44"/><path d="M88 423Q405.76 393 632 419" fill="none" stroke="#a855f7" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.38"/><path d="M88 430Q405.76 404 632 426" fill="none" stroke="#a855f7" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.32"/><path d="M88 437Q405.76 415 632 433" fill="none" stroke="#a855f7" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.26"/><path d="M88 444Q405.76 426 632 440" fill="none" stroke="#a855f7" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.2"/><text x="92" y="433" f