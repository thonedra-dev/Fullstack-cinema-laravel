<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
    <title id="title">CinemaX architecture</title><desc id="desc">A Laravel monolith with Blade views, page CSS and vanilla JavaScript, web routes, controllers, four session guards, Eloquent and scheduled booking cleanup. A hall joins a cinema to a reusable theatre type. Showtimes belong to halls. Tickets connect a booking, showtime, seat and price; bookings have payments.</desc><defs>
      <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a855f7"/><stop offset="1" stop-color="#ec4899"/></linearGradient>
      <linearGradient id="ice" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#a855f7"/></linearGradient>
      <radialGradient id="halo"><stop stop-color="#7c3aed" stop-opacity=".23"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
      <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0v40" fill="none" stroke="#a855f7" stroke-opacity=".055"/></pattern>
      <filter id="glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="5"/></filter>
    </defs>
    <style>
      text{font-family:'Segoe UI',Arial,Helvetica,sans-serif} .mono{font-family:Consolas,'Liberation Mono',monospace}
      .float{animation:float 9s ease-in-out infinite} .breathe{animation:breathe 5s ease-in-out infinite}
      .signal{stroke-dasharray:5 12;animation:signal 12s linear infinite}
      @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
      @keyframes breathe{0%,100%{opacity:.65}50%{opacity:1}}
      @keyframes signal{to{stroke-dashoffset:-170}}
      @media(prefers-reduced-motion:reduce){*{animation:none!important}}
    </style>
    <defs><clipPath id="panel"><rect width="1200" height="610" rx="24"/></clipPath></defs>
    <rect x="0.5" y="0.5" width="1199" height="609" rx="24" fill="#07070f" stroke="#282438" /><g clip-path="url(#panel)"><text x="48" y="54" font-size="16" fill="#22d3ee" font-weight="600" letter-spacing="2.8">THE ENGINE</text><text x="48" y="112" font-size="47" fill="#f0eeff" font-weight="600" letter-spacing="-1.5">Built around the show.</text><text x="48" y="174" font-size="16" fill="#22d3ee" font-weight="600" letter-spacing="2.8">THE APPLICATION</text><rect x="48" y="195" width="536" height="84" rx="12" fill="#10101b" stroke="#282438" /><text x="65" y="227" font-size="18" fill="#a855f7" font-weight="500" class="mono">01</text><text x="106" y="226" font-size="15" fill="#f0eeff" font-weight="600" letter-spacing="1.5">PRESENTATION</text><text x="65" y="259" font-size="18" fill="#aaa5bf" font-weight="400" >Blade · page CSS · vanilla JavaScript</text><path d="M316.0 280v16" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="signal"/><rect x="48" y="298" width="536" height="84" rx="12" fill="#10101b" stroke="#282438" /><text x="65" y="330" font-size="18" fill="#a855f7" font-weight="500" class="mono">02</text><text x="106" y="329" font-size="15" fill="#f0eeff" font-weight="600" letter-spacing="1.5">REQUEST LAYER</text><text x="65" y="362" font-size="18" fill="#aaa5bf" font-weight="400" >Web routes · controllers · session guards</text><path d="M316.0 383v16" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="signal"/><rect x="48" y="401" width="536" height="84" rx="12" fill="#10101b" stroke="#282438" /><text x="65" y="433" font-size="18" fill="#a855f7" font-weight="500" class="mono">03</text><text x="106" y="432" font-size="15" fill="#f0eeff" font-weight="600" letter-spacing="1.5">DATA &amp; AUTOMATION</text><text x="65" y="465" font-size="18" fill="#aaa5bf" font-weight="400" >Eloquent · relational DB · Laravel scheduler</text><text x="616" y="174" font-size="16" fill="#ec4899" font-weight="600" letter-spacing="2.8">THE DOMAIN</text><rect x="616" y="195" width="536" height="290" rx="16" fill="#100d1b" stroke="#3c2b50" /><text x="640" y="235" font-size="25" fill="#f0eeff" font-weight="600" >Cinema + theatre type</text><path d="M653 252v36h17" fill="none" stroke="#a855f7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="682" y="293" font-size="26" fill="#a855f7" font-weight="600" >Hall</text><text x="754" y="293" font-size="26" fill="#f0eeff" font-weight="600" >→ Showtime</text><text x="640" y="344" font-size="23" fill="#f0eeff" font-weight="500" >Booking → tickets + payment</text><text x="640" y="384" font-size="19" fill="#aaa5bf" font-weight="400" >Seats belong to theatre templates.</text><text x="640" y="413" font-size="19" fill="#aaa5bf" font-weight="400" >Tickets link seats to a specific showtime.</text><path d="M48 517H1152" fill="none" stroke="#282438" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="48" y="551" font-size="16" fill="#a855f7" font-weight="600" letter-spacing="2.8">SESSION GUARDS</text><text x="300" y="551" font-size="21" fill="#f0eeff" font-weight="400" >customer  /  supervisor  /  manager  /  web (employee)</text><text x="48" y="586" font-size="17" fill="#aaa5bf" font-weight="400" class="mono">app/Http/Controllers  ·  app/Models  ·  resources/views  ·  database/migrations  ·  routes/web.php</text></g></svg>