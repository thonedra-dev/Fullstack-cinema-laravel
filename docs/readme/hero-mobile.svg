<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1000" viewBox="0 0 720 1000" role="img" aria-labelledby="title desc">
    <title id="title">CinemaX — The night starts here.</title><desc id="desc">A Laravel cinema booking and operations project. Violet and pink aperture artwork inspired by the admin login. Laravel 13, PHP 8.3+, Blade, Vite 8 and Tailwind CSS 4.</desc><defs>
      <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a855f7"/><stop offset="1" stop-color="#ec4899"/></linearGradient>
      <linearGradient id="ice" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#a855f7"/></linearGradient>
      <radialGradient id="halo"><stop stop-color="#7c3aed" stop-opacity=".23"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
      <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0v40" fill="none" stroke="#a855f7" stroke-opacity=".055"/></pattern>
      <filter id="glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="5"/></filter>
    </defs>
    <style>
      text{font-family:'Segoe UI',Arial,Helvetica,sans-serif} .mono{font-family:Consolas,'Liberation Mono',monospace}
      .float{animation:float 9s ease-in-out infinite} .breathe{animation:breathe 5s ease-in-out infinite}
      .signal{stroke-dasharray:5 12;animation:signal 12s linear infinite}
      @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
      @keyframes breathe{0%,100%{opacity:.65}50%{opacity:1}}
      @keyframes signal{to{stroke-dashoffset:-170}}
      @media(prefers-reduced-motion:reduce){*{animation:none!important}}
    </style>
    <defs><clipPath id="panel"><rect width="720" height="1000" rx="24"/></clipPath></defs>
    <rect x="0.5" y="0.5" width="719" height="999" rx="24" fill="#07070f" stroke="#282438" /><g clip-path="url(#panel)"><rect width="720" height="1000" rx="24" fill="url(#grid)"/><ellipse cx="525.6" cy="450.0" rx="400" ry="340" fill="url(#halo)"/><g transform="translate(48 45) scale(0.8)" fill="none" stroke="#a855f7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="30" height="23" rx="4"/><path d="M2 10h30M2 7l-1-6 30-5 1 6M7 0l5 5M20-2l5 5"/></g><text x="91" y="64" font-size="20" fill="#f0eeff" font-weight="600" letter-spacing="2.8">CINEMAX /</text><text x="48" y="126" font-size="20" fill="#aaa5bf" font-weight="600" letter-spacing="2.8">CINEMA BOOKING SYSTEM</text><text x="44" y="230" font-size="100" fill="#f0eeff" font-weight="700" letter-spacing="-6">Cinema<tspan fill="url(#brand)">X</tspan></text><text x="48" y="291" font-size="34" fill="#f0eeff" font-weight="400" letter-spacing="-1">The night starts here.</text><text x="48" y="340" font-size="27.5" fill="#aaa5bf" font-weight="400" >A seat for every story.</text><text x="48" y="372" font-size="27.5" fill="#aaa5bf" font-weight="400" >A control room for every screen.</text><rect x="48" y="407" width="370" height="34" rx="17" fill="#151222" stroke="#ec4899" stroke-opacity=".5"/><text x="62" y="430" font-size="21.25" fill="#ec4899" font-weight="600" >BOOKING × CINEMA OPERATIONS</text><g transform="translate(360 674) scale(1.03)"><ellipse cy="190" rx="160" ry="17" fill="#a855f7" opacity=".09" filter="url(#glow)"/><g class="float"><path d="M-118.9 -148.9 L171.0 -69.4 L148.9 148.9 L-141.0 69.4Z" fill="none" stroke="#ec4899" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.92"/><path d="M-106.5 -149.0 L163.2 -62.6 L126.5 137.0 L-143.2 50.6Z" fill="none" stroke="#a855f7" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.865"/><path d="M-95.3 -148.8 L154.6 -57.0 L105.3 124.8 L-144.6 33.0Z" fill="none" stroke="#a8