ate(-9)"><g class="float"><rect x="-90" y="-55" width="226" height="143" rx="16" fill="#151022" stroke="#76518f" /><path d="M62-48V80" stroke="#76518f" stroke-dasharray="4 6"/><text x="-72" y="-26" font-size="15" fill="#ec4899" font-weight="700" letter-spacing="2">ADMIT ONE</text><text x="-72" y="9" font-size="32.5" fill="#f0eeff" font-weight="700" >CinemaX</text><text x="-72" y="52" font-size="12.5" fill="#aaa5bf" font-weight="600" letter-spacing="1.5">ENJOY THE SHOW</text><g transform="translate(82 -18) scale(0.9)" fill="none" stroke="#22d3ee" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2" width="20" height="22" rx="5"/><path d="M3 15v14h28V15M7 29v5M27 29v5"/></g></g></g><path d="M48 893H672" fill="none" stroke="#282438" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="48" y="927" font-size="20" fill="#aaa5bf" font-weight="600" letter-spacing="2.8">LARAVEL 13 / PHP 8.3+</text><text x="48" y="962" font-size="20" fill="#aaa5bf" font-weight="600" letter-spacing="2.8">BLADE / VITE 8 / TAILWIND 4</text></g></svg>