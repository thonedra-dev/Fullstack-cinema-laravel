<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="828" viewBox="0 0 1200 828" role="img" aria-labelledby="title desc">
    <title id="title">Cinema operations, from allocation to screening</title><desc id="desc">Supervisors manage cinemas, halls, services, movies, seat pricing, manager allocation, F&amp;B catalogue and finance. Branch managers schedule films, check overlaps and submit proposals for approval or revision. Seat monitoring currently admits supervisors and managers.</desc><defs>
      <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a855f7"/><stop offset="1" stop-color="#ec4899"/></linearGradient>
      <linearGradient id="ice" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#a855f7"/></linearGradient>
      <radialGradient id="halo"><stop stop-color="#7c3aed" stop-opacity=".23"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
      <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0v40" fill="none" stroke="#a855f7" stroke-opacity=".055"/></pattern>
      <filter id="glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="5"/></filter>
    </defs>
    <style>
      text{font-family:'Segoe UI',Arial,Helvetica,sans-serif} .mono{font-family:Consolas,'Liberation Mono',monospace}
      .float{animation:float 9s ease-in-out infinite} .breathe{animation:breathe 5s ease-in-out infinite}
      .signal{stroke-dasharray:5 12;animation:signal 12s linear infinite}
      @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
      @keyframes breathe{0%,100%{opacity:.65}50%{opacity:1}}
      @keyframes signal{to{stroke-dashoffset:-170}}
      @media(prefers-reduced-motion:reduce){*{animation:none!important}}
    </style>
    <defs><clipPath id="panel"><rect width="1200" height="828" rx="24"/></clipPath></defs>
    <rect x="0.5" y="0.5" width="1199" height="827" rx="24" fill="#07070f" stroke="#282438" /><g clip-path="url(#panel)"><text x="48" y="54" font-size="16" fill="#ec4899" font-weight="600" letter-spacing="2.8">BEHIND THE SCREENS</text><text x="48" y="112" font-size="47" fill="#f0eeff" font-weight="600" >One cinema. Every moving part.</text><rect x="32" y="160" width="548" height="503" rx="20" fill="#100d1d" stroke="#43305c" /><text x="60" y="198" font-size="16" fill="#a855f7" font-weight="600" letter-spacing="2.8">SUPERVISOR / ADMIN</text><text x="60" y="245" font-size="32" fill="#f0eeff" font-weight="600" >The control room.</text><rect x="60.0" y="273" width="238.0" height="84" rx="12" fill="#171226" stroke="#302443" /><g transform="translate(74.0 287) scale(0.65)" fill="none" stroke="#a855f7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 31h31M5 31V10h11v21M16 31V2h14v29M9 15h3M9 21h3M21 8h4M21 14h4M21 20h4"/></g><text x="74.0" y="337" font-size="18" fill="#f0eeff" font-weight="500" >Cinemas &amp; halls</text><rect x="314.0" y="273" width="238.0" height="84" rx="12" fill="#171226" stroke="#302443" /><g transform="translate(328.0 287) scale(0.65)" fill="none" stroke="#a855f7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="30" height="23" rx="4"/><path d="M2 10h30M2 7l-1-6 30-5 1 6M7 0l5 5M20-2l5 5"/></g><text x="328.0" y="337" font-size="18" fill="#f0eeff" font-weight="500" >Movies &amp; pricing</text><rect x="60.0" y="373" width="238.0" height="84" rx="12" fill="#171226" stroke="#302443" /><g transform="translate(74.0 387) scale(0.65)" fill="none" stroke="#a855f7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="13" cy="9" r="6"/><path d="M2 31v-5a11 11 0 0 1 22 0v5M26 4a6 6 0 0 1 0 12M29 21a10 10 0 0 1 5 10"/></g><text x="74.0" y="437" font-size="18" fill="#f0eeff" font-weight="500" >Manager allocation</text><rect x="314.0" y="373" width="238.0" height="84" rx="12" fill="#171226" stroke="#302443" /><g transform="translate(328.0 387) scale(0.65)" fill="none" stroke="#a855f7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h27l-4 21H8ZM2 12l5-6h21l5 6M17 6l4-6M10 18l1 9M24 18l-1 9"/></g><text x="328.0" y="437" font-size="18" fill="#f0eeff" font-weight="500" >F&amp;B catalogue</text><path d="M60 491H552" fill="none" stroke="#282438" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="60" y="528" font-size="24" fill="#f0eeff" font-weight="600" >Financial drilldown</text><text x="60" y="565" font-size="19" fill="#aaa5bf" font-weight="400" >Cinema → theatre → showtime</text><text x="60" y="594" font-size="19" fill="#aaa5bf" font-weight="400" >Confirmed tickets, payments and seat status.</text><path d="M60 624h492" fill="none" stroke="#a855f7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="signal"/><circle cx="60" cy="624" r="5" fill="#a855f7"/><circle cx="306.0" cy="624" r="5" fill="#a855f7"/><circle cx="552" cy="624" r="5" fill="#a855f7"/><rect x="604" y="160" width="564" height="234" rx="20" fill="#0e0e1a" stroke="#282438" /><text x="630" y="196" font-size="16" fill="#ec4899" font-weight="600" letter-spacing="2.8">BRANCH MANAGER</text><text x="630" y="236" font-size="27" fill="#f0eeff" font-weight="600" >Plan the next screening.</text><text x="630" y="271" font-size="20" fill="#aaa5bf" font-weight="400" >Quotas, hall schedules and overlap checks.</text><text x="630" y="300" font-size="20" fill="#aaa5bf" font-weight="400" >Proposal review, revisions and notifications.</text><rect x="632.0" y="328" width="161.33333333333334" height="39" rx="8" fill="#171226" stroke="#a855f7" /><text x="645.0" y="354" font-size="18" fill="#a855f7" font-weight="500" >Plan</text><rect x="801.3333333333334" y="328" width="161.33333333333334" height="39" rx="8" fill="#171226" stroke="#ec4899" /><text x="814.3333333333334" y="354" font-size="18" fill="#ec4899" font-weight="500" >Review</text><rect x="970.6666666666667" y="328" width="161.33333333333334" height="39" rx="8" fill="#171226" stroke="#22d3ee" /><text x="983.6666666666667" y="354" font-size="18" fill="#22d3ee" font-weight="500" >Live</text><rect x="604" y="418" width="564" height="245" rx="20" fill="#0e0e1a" stroke="#282438" /><text x="630" y="454" font-size="16" fill="#22d3ee" font-weight="600" letter-spacing="2.8">SEAT MONITOR</text><text x="630" y="495" font-size="27" fill="#f0eeff" font-weight="600" >Keep an eye on the house.</text><text x="630" y="531" font-size="20" fill="#aaa5bf" font-weight="400" >Supervisor + manager access.</text><g transform="translate(632.0 568) scale(0.72)"><g ><rect x="3" y="0" width="23" height="22" rx="5" fill="#22c55e" stroke="#22c55e" fill-opacity=".17"/><path d="M0 12v15h29V12M5 27v4M24 27v4" fill="none" stroke="#22c55e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" /></g></g><text x="667.0" y="589" font-size="18" fill="#22c55e" font-weight="400" >Available</text><g transform="translate(801.3333333333334 568) scale(0.72)"><g ><rect x="3" y="0" width="23" height="22" rx="5" fill="#f97316" stroke="#f97316" fill-opacity=".17"/><path d="M0 12v15h29V12M5 27v4M24 27v4" fill="none" stroke="#f97316" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" /></g></g><text x="836.3333333333334" y="589" font-size="18" fill="#f97316" font-weight="400" >Held</text><g transform="translate(970.6666666666667 568) scale(0.72)"><g ><rect x="3" y="0" width="23" height="22" rx="5" fill="#ef4444" stroke="#ef4444" fill-opacity=".17"/><path d="M0 12v15h29V12M5 27v4M24 27v4" fill="none" stroke="#ef4444" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" /></g></g><text x="1005.6666666666667" y="589" font-size="18" fill="#ef4444" font-weight="400" >Sold</text><text x="48" y="712" font-size="16" fill="#aaa5bf" font-weight="600" letter-spacing="2.8">THE RELEASE WORKFLOW</text><text x="48" y="757" font-size="18" fill="#a855f7" font-weight="500" class="mono">01</text><text x="86" y="757" font-size="25" fill="#f0eeff" font-weight="500" >Allocate</text><path d="M220 750h64m-7-5 7 5-7 5" fill="none" stroke="#716681" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="signal"/><text x="330" y="757" font-size="18" fill="#ec4899" font-weight="500" class="mono">02</text><text x="368" y="757" font-size="25" fill="#f0eeff" font-weight="500" >Plan</text><path d="M502 750h64m-7-5 7 5-7 5" fill="none" stroke="#716681" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="signal"/><text x="612" y="757" font-size="18" fill="#ec4899" font-weight="500" class="mono">03</text><text x="650" y="757" font-size="25" fill="#f0eeff" font-weight="500" >Review</text><path d="M784 750h64m-7-5 7 5-7 5" fill="none" stroke="#716681" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="signal"/><text x="894" y="757" font-size="18" fill="#22d3ee" font-weight="500" class="mono">04</text><text x="932" y="757" font-size="25" fill="#f0eeff" font-weight="500" >Screen</text><text x="48" y="799" font-size="18" fill="#aaa5bf" font-weight="400" >Rejected proposals return to the branch manager for revision.</text></g></svg>