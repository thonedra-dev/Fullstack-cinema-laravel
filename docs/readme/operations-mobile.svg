<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1420" viewBox="0 0 720 1420" role="img" aria-labelledby="title desc">
    <title id="title">Cinema operations, from allocation to screening</title><desc id="desc">Supervisors manage cinemas, halls, services, movies, seat pricing, manager allocation, F&amp;B catalogue and finance. Branch managers schedule films, check overlaps and submit proposals for approval or revision. Seat monitoring currently admits supervisors and managers.</desc><defs>
      <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a855f7"/><stop offset="1" stop-color="#ec4899"/></linearGradient>
      <linearGradient id="ice" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#a855f7"/></linearGradient>
      <radialGradient id="halo"><stop stop-color="#7c3aed" stop-opacity=".23"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
      <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0v40" fill="none" stroke="#a855f7" stroke-opacity=".055"/></pattern>
      <filter id="glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="5"/></filter>
    </defs>
    <style>
      text{font-family:'Segoe UI',Arial,Helvetica,sans-serif} .mono{font-family:Consolas,'Liberation Mono',monospace}
      .float{animation:float 9s ease-in-out infinite} .breathe{animation:breathe 5s ease-in-out infinite}
      .signal{stroke-dasharray:5 12;animation:signal 12s linear infinite}
      @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
      @keyframes breathe{0%,100%{opacity:.65}50%{opacity:1}}
      @keyframes signal{to{stroke-dashoffset:-170}}
      @media(prefers-reduced-motion:reduce){*{animation:none!important}}
    </style>
    <defs><clipPath id="panel"><rect width="720" height="1420" rx="24"/></clipPath></defs>
    <rect x="0.5" y="0.5" width="719" height="1419" rx="24" fill="#07070f" stroke="#282438" /><g clip-path="url(#panel)"><text x="48" y="54" font-size="20" fill="#ec4899" font-weight="600" letter-spacing="2.8">BEHIND THE SCREENS</text><text x="48" y="112" font-size="43" fill="#f0eeff" font-weight="600" >One cinema.</text><text x="48" y="167" font-size="43" fill="#f0eeff" font-weight="600" >Every moving part.</text><rect x="48" y="210" width="624" height="503" rx="20" fill="#100d1d" stroke="#43305c" /><text x="76" y="248" font-size="20" fill="#a855f7" font-weight="600" letter-spacing="2.8">SUPERVISOR / ADMIN</text><text x="76" y="295" font-size="32" fill="#f0eeff" font-weight="600" >The control room.</text><rect x="76.0" y="323" width="276.0" height="84" rx="12" fill="#171226" stroke="#302443" /><g transform="translate(90.0 337) scale(0.65)" fill="none" stroke="#a855f7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 31h31M5 31V10h11v21M16 31V2h14v29M9 15h3M9 21h3M21 8h4M21 14h4M21 20h4"/></g><text x="90.0" y="387" font-size="22.5" fill="#f0eeff" font-weight="500" >Cinemas &amp; halls</text><rect x="368.0" y="323" width="276.0" height="84" rx="12" fill="#171226" stroke="#302443" /><g transform="translate(382.0 337) scale(0.65)" fill="none" stroke="#a855f7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="30" height="23" rx="4"/><path d="M2 10h30M2 7l-1-6 30-5 1 6M7 0l5 5M20-2l5 5"/></g><text x="382.0" y="387" font-size="22.5" fill="#f0eeff" font-weight="500" >Movies &amp; pricing</text><rect x="76.0" y="423" width="276.0" height="84" rx="12" fill="#171226" stroke="#302443" /><g transform="translate(90.0 437) scale(0.65)" fill="none" stroke="#a855f7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="13" cy="9" r="6"/><path d="M2 31v-5a11 11 0 0 1 22 0v5M26 4a6 6 0 0 1 0 12M29 21a10 10 0 0 1 5 10"/></g><text x="90.0" y="487" font-size="22.5" fill="#f0eeff" font-weight="500" >Manager allocation</text><rect x="368.0" y="423" width="276.0" height="84" rx="12" fill="#171226" stroke="#302443" /><g transform="translate(382.0 437) scale(0.65)" fill="none" stroke="#a855f7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h27l-4 21H8ZM2 12l5-6h21l5 6M17 6l4-6M10 18l1 9M24 18l-1 9"/></g><text x="382.0" y="487" font-size="22.5" fill="#f0eeff" font-weight="500" >F&amp;B catalogue</text><path d="M76 541H644" fill="none" stroke="#282438" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="76" y="578" font-size="30" fill="#f0eeff" font-weight="600" >Financial drilldown</text><text x="76" y="615" font-size="23.75" fill="#aaa5bf" font-weight="400" >Cinema → theatre → showtime</text><text x="76" y="644" font-size="23.75" fill="#aaa5bf" font-weight="400" >Confirmed tickets, payments and seat status.</text><path d="M76 674h568" fill="none" stroke="#a855f7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="signal"/><circle cx="76" cy="674" r="5" fill="#a855f7"/><circle cx="360.0" cy="674" r="5" fill="#a855f7"/><circle cx="644" cy="674" r="5" fill="#a855f7"/><rect x="48" y="737" width="624" height="234" rx="20" fill="#0e0e1a" stroke="#282438" /><text x="74" y="773" font-size="20" fill="#ec4899" font-weight="600" letter-spacing="2.8">BRANCH MANAGER</text><text x="74" y="813" font-size="33.75" fill="#f0eeff" font-weight="600" >Plan the next screening.</text><text x="74" y="848" font-size="25" fill="#aaa5bf" font-weight="400" >Quotas, hall schedules and overlap checks.</text><text x="74" y="877" font-size="25" fill="#aaa5bf" font-weight="400" >Proposal review, revisions and notifications.</text><rect x="76.0" y="905" width="181.33333333333334" height="39" rx="8" fill="#171226" stroke="#a855f7" /><text x="89.0" y="931" font-size="22.5" fill="#a855f7" font-weight="500" >Plan</text><rect x="265.33333333333337" y="905" width="181.33333333333334" height="39" rx="8" fill="#171226" stroke="#ec4899" /><text x="278.33333333333337" y="931" font-size="22.5" fill="#ec4899" font-weight="500" >Review</text><rect x="454.6666666666667" y="905" width="181.33333333333334" height="39" rx="8" fill="#171226" stroke="#22d3ee" /><text x="467.6666666666667" y="931" font-size="22.5" fill="#22d3ee" font-weight="500" >Live</text><rect x="48" y="995" width="624" height="221" rx="20" fill="#0e0e1a" stroke="#282438" /><text x="74" y="1031" font-size="20" fill="#22d3ee" font-weight="600" letter-spacing="2.8">SEAT MONITOR</text><text x="74" y="1072" font-size="33.75" fill="#f0eeff" font-weight="600" >Keep an eye on the house.</text><text x="74" y="1108" font-size="25" fill="#aaa5bf" font-weight="400" >Supervisor + manager access.</text><g transform="translate(76.0 1145) scale(0.72)"><g ><rect x="3" y="0" width="23" height="22" rx="5" fill="#22c55e" stroke="#22c55e" fill-opacity=".17"/><path d="M0 12v15h29V12M5 27v4M24 27v4" fill="none" stroke="#22c55e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" /></g></g><text x="111.0" y="1166" font-size="22.5" fill="#22c55e" font-weight="400" >Available</text><g transform="translate(265.33333333333337 1145) scale(0.72)"><g ><rect x="3" y="0" width="23" height="22" rx="5" fill="#f97316" stroke="#f97316" fill-opacity=".17"/><path d="M0 12v15h29V12M5 27v4M24 27v4" fill="none" stroke="#f97316" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" /></g></g><text x="300.33333333333337" y="1166" font-size="22.5" fill="#f97316" font-weight="400" >Held</text><g transform="translate(454.6666666666667 1145) scale(0.72)"><g ><rect x="3" y="0" width="23" height="22" rx="5" fill="#ef4444" stroke="#ef4444" fill-opacity=".17"/><path d="M0 12v15h29V12M5 27v4M24 27v4" fill="none" stroke="#ef4444" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" /></g></g><text x="489.6666666666667" y="1166" font-size="22.5" fill="#ef4444" font-weight="400" >Sold</text><text x="48" y="1263" font-size="20" fill="#aaa5bf" font-weight="600" letter-spacing="2.8">THE RELEASE WORKFLOW</text><text x="48" y="1303" font-size="28.75" fill="#f0eeff" font-weight="400" >Allocate → plan → review → screen</text><text x="48" y="1337" font-size="28.75" fill="#f0eeff" font-weight="400" >Rejected proposals return for revision.</text></g></svg>